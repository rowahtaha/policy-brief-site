name: Build Rowa's Thoughts

# Fires whenever a post is added/edited (Decap CMS commits straight to thoughts/*.md)
# or the build script itself changes. Regenerates thoughts.html and thoughts/<slug>.html
# as real static HTML and commits the result back to main, so GitHub Pages serves actual
# content instead of a client-side-only "Loading…" page. Path filters are scoped to *.md
# (not thoughts/**) so the workflow's own commit of generated thoughts/*.html never
# re-triggers itself.
on:
  push:
    branches: [main]
    paths:
      - "thoughts/*.md"
      - "scripts/build-thoughts.mjs"
      - ".github/workflows/build-thoughts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build:thoughts
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add thoughts.html thoughts/*.html
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Rebuild Rowa's Thoughts pages [skip ci]"
          git push
