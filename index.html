<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Digital Divide — Rowa Taha</title>
<meta name="description" content="Weekly tech policy news, a digital policy atlas for Africa and the Americas, and job-search notes from Rowa Taha.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

  :root {
    --ink: #f2e3dd;
    --ground: #170a0d;
    --matrix: #c2404f;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--ground);
    color: var(--ink);
    overflow: hidden;
    font-family: 'IBM Plex Mono', Consolas, monospace;
  }

  a { color: inherit; }

  #rain {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
  }

  .veil {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, rgba(23,10,13,0.25) 0%, rgba(23,10,13,0.7) 62%, rgba(23,10,13,0.92) 100%);
    pointer-events: none;
  }

  .gate {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; text-decoration: none;
    padding: 24px;
  }

  .gate-logo {
    width: 108px; height: 108px; border-radius: 50%; object-fit: cover;
    box-shadow: 0 0 0 2px rgba(242,227,221,0.25), 0 0 70px -10px rgba(194,64,79,0.75);
    margin-bottom: 26px;
    animation: rise 1s ease-out both;
  }

  .gate h1 {
    font-family: 'IBM Plex Mono', Consolas, monospace;
    font-weight: 700;
    font-size: clamp(3.4rem, 11vw, 7.2rem);
    letter-spacing: -1px;
    margin: 0;
    color: var(--matrix);
    text-shadow: 0 0 18px rgba(194,64,79,0.6), 0 0 46px rgba(194,64,79,0.32);
    text-wrap: balance;
    animation: rise 1s ease-out both; animation-delay: .16s;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .gate-logo, .gate h1 {
      animation: none; opacity: 1; transform: none;
    }
  }
</style>
</head>
<body>

<canvas id="rain" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>

<a class="gate" href="home.html" aria-label="Enter The Digital Divide">
  <img class="gate-logo" src="assets/logo.png" alt="">
  <h1>The Digital Divide</h1>
</a>

<script>
  const canvas = document.getElementById('rain');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let cols, drops, fontSize;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    fontSize = Math.max(16, Math.min(22, window.innerWidth / 55));
    cols = Math.floor(canvas.width / fontSize);
    drops = new Array(cols).fill(0).map(() => Math.floor(Math.random() * -40));
  }
  resize();
  window.addEventListener('resize', resize);

  const glyphs = '01';

  function drawFrame() {
    ctx.fillStyle = 'rgba(23,10,13,0.15)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = fontSize + 'px "IBM Plex Mono", monospace';

    for (let i = 0; i < cols; i++) {
      const glyph = glyphs[Math.random() > 0.5 ? 1 : 0];
      const y = drops[i] * fontSize;

      ctx.fillStyle = 'rgba(238,179,170,0.95)';
      ctx.fillText(glyph, i * fontSize, y);

      if (y > fontSize * 1.2) {
        ctx.fillStyle = 'rgba(194,64,79,0.6)';
        ctx.fillText(glyphs[Math.random() > 0.5 ? 1 : 0], i * fontSize, y - fontSize);
      }
      if (y > fontSize * 2.4) {
        ctx.fillStyle = 'rgba(110,28,40,0.35)';
        ctx.fillText(glyphs[Math.random() > 0.5 ? 1 : 0], i * fontSize, y - fontSize * 2);
      }

      if (y > canvas.height && Math.random() > 0.975) {
        drops[i] = Math.floor(Math.random() * -20);
      }
      drops[i]++;
    }
  }

  if (reduceMotion) {
    ctx.fillStyle = 'rgba(23,10,13,1)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = fontSize + 'px "IBM Plex Mono", monospace';
    for (let i = 0; i < cols; i++) {
      ctx.fillStyle = 'rgba(194,64,79,0.5)';
      for (let j = 0; j < 30; j++) {
        ctx.fillText(glyphs[Math.random() > 0.5 ? 1 : 0], i * fontSize, j * fontSize * 1.4);
      }
    }
  } else {
    setInterval(drawFrame, 55);
  }
</script>

</body>
</html>
